[workspace]
members = [".", "crates/seyk-embed", "crates/seyk-embeddinggemma", "crates/seyk-core"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[package]
name = "seyk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local-first semantic search over files, built around Google's EmbeddingGemma 2"
license.workspace = true
readme = "README.md"
keywords = ["semantic-search", "embeddings", "embeddinggemma", "local-first", "search"]
categories = ["command-line-utilities", "text-processing"]

[features]
default = ["onnx", "image", "cli", "mcp", "watch", "pdf-render"]
onnx = ["dep:seyk-embeddinggemma", "dep:hf-hub"]
image = ["seyk-embeddinggemma?/image"]
audio = ["seyk-core/audio", "seyk-embeddinggemma?/audio"]
cli = ["onnx", "dep:clap", "dep:anyhow"]
mcp = ["cli", "watch", "dep:rmcp", "dep:tokio", "dep:schemars"]
watch = ["seyk-core/watch"]

pdf = ["seyk-core/pdf"]
pdf-render = ["pdf", "image", "seyk-core/pdf-render"]

[dependencies]
seyk-core = { path = "crates/seyk-core", version = "0.1.0" }
seyk-embed = { path = "crates/seyk-embed", version = "0.1.0" }
seyk-embeddinggemma = { path = "crates/seyk-embeddinggemma", version = "0.1.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
dirs = "6"
hf-hub = { version = "0.4", optional = true, default-features = false, features = ["ureq", "rustls-tls"] }
clap = { version = "4", optional = true, features = ["derive", "env", "wrap_help"] }
anyhow = { version = "1", optional = true }
rmcp = { version = "3.5", optional = true, default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "time", "sync"] }
schemars = { version = "1", optional = true }

[dev-dependencies]
flate2 = "1"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
assert_cmd = "2"
predicates = "3"

[target.'cfg(unix)'.dev-dependencies]
# Peak RSS and load average in examples/bench_model.rs.
libc = "0.2"

[[bin]]
name = "seyk"
path = "src/bin/seyk/main.rs"
required-features = ["cli"]

[[example]]
name = "bench_model"
required-features = ["onnx"]

[[example]]
name = "eval_corpus"
required-features = ["onnx"]

[profile.release]
lto = "thin"
codegen-units = 1

[[example]]
name = "bench_cpu_pool"
required-features = ["onnx"]

[[example]]
name = "bench_retrieval"
required-features = ["cli"]
