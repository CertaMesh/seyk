# Ignore only these unmaintained advisories, not vulnerabilities. Revisit when
# stable upstream releases remove the affected transitive dependencies.
[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is required by tokenizers 0.23.2, the latest stable release; the 1.0 rewrite is still a prerelease and changes tokenizer behavior/API." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is required by lopdf 0.42.0 through pdf-extract 0.12.1; the latest published pdf-extract and compatible lopdf releases still require it." },
]

# Symphonia exceptions approved in design pad 11605, decision 1; package + version scoped.
# Only permissive licence choices are accepted. GPL/AGPL/LGPL/SSPL and MPL
# cannot pass without an explicit, reviewed exception. Alternative expressions
# (e.g. MIT OR LGPL) select the permissive choice, never the copyleft choice.
[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "CC0-1.0",
    "CDLA-Permissive-2.0", "Unicode-3.0", "Zlib",
]
confidence-threshold = 0.9

# Approved: Solo project 73 pad 11511, E1 decision (2026-10-08); existing dirs dependency.
[[licenses.exceptions]]
name = "option-ext"
version = "=0.2.0"
allow = ["MPL-2.0"]

