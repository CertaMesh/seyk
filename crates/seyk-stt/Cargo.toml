[package]
name = "seyk-stt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Overrides the workspace licence: the bundled Whisper mel filters are MIT.
license = "Apache-2.0 AND MIT"
description = "Offline, on-demand Whisper transcription for Seyk"
repository.workspace = true
readme = "README.md"
keywords = ["whisper", "speech-to-text", "transcription", "offline", "onnx"]
categories = ["multimedia::audio", "science"]
include = ["/src/**", "/README.md", "/LICENSE*", "/NOTICE*", "/assets/**"]

[dependencies]
seyk-core = { path = "../seyk-core", version = "0.2.0", features = ["audio"] }
ort = "=2.0.0-rc.13"
rustfft = "=6.4.1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
dirs = "6"
tempfile = "3"

[dev-dependencies]
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
# ort-sys skips native downloads and linking when docs.rs sets DOCS_RS.
