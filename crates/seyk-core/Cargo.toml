[package]
name = "seyk-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local search, evidence and cache engine"

[features]
default = []
watch = ["dep:notify"]

[dependencies]
seyk-embed = { path = "../seyk-embed", version = "0.2.0-dev" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
globset = "0.4"
notify = { version = "8", optional = true }
dirs = "6"
url = "2.5.8"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "similarity"
harness = false
