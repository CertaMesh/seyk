[package]
name = "seyk-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local search, evidence and cache engine"
repository.workspace = true
readme = "README.md"
keywords = ["search", "semantic-search", "retrieval", "local-first", "evidence"]
categories = ["text-processing", "filesystem"]
include = ["/src/**", "/README.md", "/LICENSE*", "/NOTICE*"]

[features]
default = []
# Observation hooks for debug tests; compiled out of release even if enabled.
test-support = []
audio = ["dep:symphonia"]
pdf = ["dep:pdf-extract", "dep:flate2"]
pdf-render = ["pdf", "dep:hayro"]
watch = ["dep:notify"]

[dependencies]
symphonia = { version = "=0.5.5", optional = true, default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "pcm", "wav"] }
flate2 = { version = "1", optional = true }
pdf-extract = { version = "=0.12.1", optional = true }
hayro = { version = "=0.5.0", optional = true }
seyk-embed = { path = "../seyk-embed", version = "0.1.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
globset = "0.4"
# Reuse the existing normalization dependency; caseless supplies full Unicode folds.
unicode-normalization = "0.1.25"
caseless = "0.2.2"
notify = { version = "8", optional = true }
dirs = "6"
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Unix discovery walks from pinned directory handles instead.
[target.'cfg(not(unix))'.dependencies]
walkdir = "2"

[dev-dependencies]
seyk-core = { path = ".", features = ["test-support"] }
tempfile = "3"
# Parity reference for the pinned walk.
walkdir = "2"
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "similarity"
harness = false

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
# ort-sys skips native downloads and linking when docs.rs sets DOCS_RS.
