[package]
name = "seyk-embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Overrides the workspace licence: the bundled Photo Anchor tables are CC BY 4.0.
license = "Apache-2.0 AND CC-BY-4.0"
description = "Model-independent embedding interfaces and values"
repository.workspace = true
readme = "README.md"
keywords = ["embeddings", "vectors", "semantic-search", "local-first"]
categories = ["science", "text-processing"]
include = ["/src/**", "/README.md", "/LICENSE*", "/NOTICE*", "/assets/photo-anchor/manifest.json", "/assets/photo-anchor/NOTICE.md", "/assets/photo-anchor/*.bin"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
# ort-sys skips native downloads and linking when docs.rs sets DOCS_RS.
