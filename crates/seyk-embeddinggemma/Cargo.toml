[package]
name = "seyk-embeddinggemma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local EmbeddingGemma 2 inference"
repository.workspace = true
readme = "README.md"
keywords = ["embeddinggemma", "embeddings", "onnx", "gemma", "local-first"]
categories = ["science", "text-processing"]
include = ["/src/**", "/README.md", "/LICENSE*", "/NOTICE*"]

[features]
default = []
audio = ["dep:rustfft", "dep:libc"]
image = ["dep:image", "dep:fast_image_resize"]

[dependencies]
rayon = "1.11"
rustfft = { version = "=6.4.1", optional = true }
seyk-embed = { path = "../seyk-embed", version = "0.1.0" }
ort = "=2.0.0-rc.13"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
dirs = "6"
blake3 = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
fast_image_resize = { version = "5", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"

[[example]]
name = "image_text"
required-features = ["image"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
# ort-sys skips native downloads and linking when docs.rs sets DOCS_RS.
