[package]
name = "seyk-4b-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "Apache-2.0"
[workspace]
[features]
default = []
render = ["dep:hayro"]
ocr = ["dep:paddle-ocr-rs"]
embed = ["dep:seyk-embed", "dep:seyk-embeddinggemma"]
native-ocr = ["dep:geo-clipper", "dep:geo-types"]
[dependencies]
hayro = { version = "=0.5.0", optional = true }
paddle-ocr-rs = { version = "=0.6.1", optional = true }
ort = "=2.0.0-rc.13"
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1"
sha2 = "0.10"
serde_json = "1"
seyk-embed = { path = "../../crates/seyk-embed", optional = true }
seyk-embeddinggemma = { path = "../../crates/seyk-embeddinggemma", optional = true, features = ["image"] }
geo-clipper = { version = "=0.9.0", optional = true }
geo-types = { version = "0.7", optional = true }
[profile.release]
strip = true
