name: Release

# Push a tag like v0.2.0 to build every target and publish a GitHub release.
# Run manually, or change this file in a PR, to build the archives without
# releasing (they stay as workflow artifacts). Manual runs NEVER publish,
# including when dispatched against a tag; only a tag push can publish.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml, "crates/seyk-core/**", "tests/pdf_cli.rs", Cargo.toml, Cargo.lock, "scripts/check_release_no_observer.py", "scripts/check_release_archive.py", ".gitattributes", "scripts/third_party_licenses.sh", about.toml, about.hbs, "third_party/onnxruntime/**", THIRD_PARTY.md, "crates/seyk-stt/Cargo.toml", "crates/seyk-embed/Cargo.toml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only targets ONNX Runtime ships prebuilt binaries for. There is
          # none for Intel macOS, so it is left out rather than built from source.
          - { target: aarch64-apple-darwin, os: macos-15 }
          # ONNX Runtime's prebuilt library needs glibc 2.38+, so Ubuntu 24.04 is
          # the oldest runner that links, and the binary needs glibc 2.38+ too.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Pinned in rust-toolchain.toml. Every target is the runner's own.
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }

      - run: cargo build --release --locked --target ${{ matrix.target }} --bin seyk

      - name: Offline PDF extraction and panic containment smoke
        run: cargo test --release --locked --target ${{ matrix.target }} --test pdf_cli

      - name: Check packaged binary has no test observer
        if: runner.os != 'Windows'
        run: python scripts/check_release_no_observer.py target/${{ matrix.target }}/release/seyk

      - name: Inspect linked libraries
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/seyk"
          case "${{ matrix.target }}" in
            *apple*) otool -L "$binary" ;;
            *linux*) ldd "$binary" ;;
            *windows*) objdump -p "$binary.exe" | grep "DLL Name" ;;
          esac

      - name: Install pinned licence generator
        shell: bash
        run: cargo install cargo-about --version 0.8.2 --locked

      - name: Generate third-party licence bundle
        shell: bash
        run: scripts/third_party_licenses.sh

      - name: Package
        shell: bash
        run: |
          version=$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)
          name="seyk-$version-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE THIRD_PARTY.md THIRD_PARTY_LICENSES.html "$name/"
          mkdir -p "$name/third_party/onnxruntime"
          cp third_party/onnxruntime/* "$name/third_party/onnxruntime/"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "target/${{ matrix.target }}/release/seyk.exe" "$name/"
            7z a -bso0 "$name.zip" "$name"
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/seyk" "$name/"
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          # Smoke test: the binary starts and reports its version.
          "$name/seyk" --version
          # shasum is missing on Windows runners, sha256sum on macOS.
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Verify licence notices in the archive
        shell: bash
        run: python scripts/check_release_archive.py "$ARCHIVE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  attest:
    name: attest release archives
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check all four archives and checksums before attestation
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          checksums=(dist/*.sha256)
          [[ "${#archives[@]}" -eq 4 && "${#checksums[@]}" -eq 4 ]] || {
            echo "Expected four release archives and four checksum files" >&2; exit 1; }
          (cd dist && sha256sum -c -- *.sha256)
      - name: Attest every release archive and checksum
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Seyk $GITHUB_REF_NAME" \
            --generate-notes
