name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The version pinned in rust-toolchain.toml, so a new Rust release cannot
      # fail a PR that changed nothing. See rust-canary.yml for the newest one.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Model-backed tests are #[ignore]d: CI never downloads the weights.
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo test --example bench_retrieval --locked
      - name: Check audio-free ONNX library
        run: cargo check -p seyk --no-default-features --features onnx --lib --locked
      - name: Check standalone dependency boundaries
        run: python scripts/check_embedding_dependencies.py
      - name: Check minimal facade library
        run: cargo check -p seyk --no-default-features --lib --locked
      - name: Check CLI without other default features
        run: cargo check -p seyk --no-default-features --features cli --bin seyk --locked
      - name: Lint standalone text backend
        run: cargo clippy -p seyk-embeddinggemma --no-default-features --all-targets --locked -- -D warnings
      - name: Test standalone core
        run: cargo test -p seyk-core --no-default-features --locked
      - name: Test core with PDF text extraction
        run: cargo test -p seyk-core --no-default-features --features pdf --locked
      - name: Test core with PDF rendering
        run: cargo test -p seyk-core --no-default-features --features pdf,pdf-render --locked

  retrieval-harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Check deterministic benchmark chart (synthetic inputs only)
        run: uv run --no-project --python 3.12 python -m unittest discover -s scripts/bench -p test_chart.py
      - name: Check retrieval metrics and data adapters (synthetic inputs only)
        run: UV_CACHE_DIR="$HOME/.cache/seyk-bench/uv" uv run --locked --python 3.12 scripts/bench/bench.py test

  photo-calibration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Export synthetic production scores without loading models
        run: cargo run --locked --example photo_calibration_export -- --synthetic calibration-reference.json
      - name: Test calibration preparation without network or models
        env:
          SEYK_CALIBRATION_REFERENCE: calibration-reference.json
          SEYK_CALIBRATION_EXPORTER: target/debug/examples/photo_calibration_export
        run: uv run --python 3.12 --with-requirements scripts/photo_calibration/requirements.txt python -m unittest discover -s scripts/photo_calibration -p 'test_*.py'

  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.99.0"
          command: check licenses
          arguments: --locked --all-features
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.89
      - run: cargo +1.89.0 check --workspace --all-targets --locked
      - run: cargo +1.89.0 build --workspace --locked
      - run: cargo +1.89.0 check -p seyk --no-default-features --features onnx --lib --locked
