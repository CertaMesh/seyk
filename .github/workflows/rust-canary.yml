name: Rust canary

# Runs the CI checks on the newest stable Rust, ignoring the pin in
# rust-toolchain.toml. A failure here blocks nothing; it means raising the pin
# will need work (usually a new clippy lint).
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  latest-stable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: rustc --version
      - uses: ./.github/actions/rust-checks
