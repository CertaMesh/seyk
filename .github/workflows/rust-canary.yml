name: Rust canary

# Runs the CI checks on the newest stable Rust, ignoring the pin in
# rust-toolchain.toml. A failure here blocks nothing; it means raising the pin
# will need work (usually a new clippy lint).
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  latest-stable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: rustc --version
      - uses: ./.github/actions/rust-checks
